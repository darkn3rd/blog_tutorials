# mise has no Vagrant or VirtualBox tools, so deps installs everything with Homebrew.

[tasks.deps]
description = "Install Vagrant, VirtualBox and Ansible if they're missing"
run = [
  "command -v vagrant >/dev/null || brew install --cask vagrant",
  "command -v VBoxManage >/dev/null || brew install --cask virtualbox",
  "command -v ansible-playbook >/dev/null || brew install ansible",
]

[tasks.versions]
description = "Print the macOS, Vagrant, VirtualBox and Ansible versions"
run = '''
printf "%-14s%s\n" \
  macOS: $(sw_vers --productVersion) \
  Vagrant: $(vagrant --version | cut -d' ' -f2) \
  VirtualBox: $(VBoxManage --version | cut -d'r' -f1) \
  ansible-core: $(ansible --version | sed -n '1s/.* //; 1s/]//p')
'''

[tasks.up]
description = "Download the box and launch the four VMs"
run = '''
if [ "${PROVISION:-false}" = true ]; then flag=--provision; else flag=--no-provision; fi
vagrant up --provider=virtualbox "$flag"
'''

[tasks.provision]
description = "Run the Ansible playbook on all VMs through Vagrant"
run = "vagrant provision lb"

[tasks.playbook]
description = "Run the Ansible playbook directly from the host"
run = [
  "vagrant ssh-config > .vagrant/ssh.config",
  "ansible-playbook playbook.yaml",
]

[tasks.verify]
description = "Request the page six times through the load balancer"
run = '''
for i in 1 2 3 4 5 6; do
  curl --silent --fail http://localhost:8080 | grep '<title>'
done
'''

[tasks.ssh]
description = "Log into a VM (VM=web1 mise run ssh); defaults to lb"
run = "vagrant ssh ${VM:-lb} || true"
raw = true

[tasks.status]
description = "Show the VM status"
run = "vagrant status"

[tasks.halt]
description = "Shut down the VMs"
run = "vagrant halt"

[tasks.destroy]
description = "Delete the VMs"
run = "vagrant destroy --force"

[tasks.purge]
description = "Delete the downloaded box"
run = '''
if vagrant box list | grep -q '^bento/ubuntu-26.04 *(virtualbox'; then
  vagrant box remove bento/ubuntu-26.04 --provider virtualbox --all --force
else
  echo "No cached box to remove."
fi
'''
