# The Makefile builds the VM from file dependencies, so the VM tasks here run make.

# deps uses Homebrew on macOS and apt on Linux.
[tasks.deps]
description = "Install QEMU and Ansible if they're missing, plus mtools on Linux"
run = '''
case "$(uname -s)" in
Darwin)
  command -v qemu-system-aarch64 >/dev/null || brew install qemu
  command -v ansible-playbook >/dev/null || brew install ansible
  ;;
Linux)
  command -v qemu-system-x86_64 >/dev/null ||
    sudo apt-get install -y qemu-system-x86 qemu-utils
  command -v mformat >/dev/null || sudo apt-get install -y mtools
  command -v ansible-playbook >/dev/null || sudo apt-get install -y ansible
  ;;
esac
'''

[tasks.versions]
description = "Print the OS, QEMU and Ansible versions"
run = '''
if command -v sw_vers >/dev/null; then
  os="macOS $(sw_vers --productVersion)"
else
  os="$(. /etc/os-release && echo "$PRETTY_NAME")"
fi
qemu="qemu-system-$(uname -m | sed 's/^arm64$/aarch64/')"
printf "%-14s%s\n" OS: "$os"
printf "%-14s%s\n" QEMU: "$($qemu --version | sed -n '1s/.*version \([^ ]*\).*/\1/p')"
printf "%-14s%s\n" ansible-core: "$(ansible --version | sed -n '1s/.* //; 1s/]//p')"
'''

[tasks.up]
description = "Download the image, create or start the VM and wait for it"
run = "make up"

[tasks.provision]
description = "Run the Ansible playbook on the guest"
run = "make provision"

[tasks.verify]
description = "Check the web page with curl"
run = "make verify"

[tasks.ssh]
description = "Log into the guest"
run = "make ssh || true"
raw = true

[tasks.status]
description = "Show the VM status"
run = "make status"

[tasks.halt]
description = "Shut down the guest"
run = "make halt"

[tasks.reload]
description = "Restart the VM, without provisioning unless PROVISION=true"
run = "make reload"

[tasks.destroy]
description = "Delete the VM, keeping the downloaded image"
run = "make destroy"

[tasks.purge]
description = "Delete the downloaded image"
run = "make purge"
