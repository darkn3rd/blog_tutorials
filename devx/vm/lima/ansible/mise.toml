[tools]
lima = "2.2"

# deps installs Lima with mise, and Ansible with Homebrew on macOS or apt on
# Linux. On Linux, Lima also needs QEMU.
[tasks.deps]
description = "Install Lima and Ansible if they're missing, plus QEMU on Linux"
run = '''
mise install
case "$(uname -s)" in
Darwin)
  command -v ansible-playbook >/dev/null || brew install ansible
  ;;
Linux)
  command -v "qemu-system-$(uname -m)" >/dev/null ||
    sudo apt-get install -y qemu-system-x86 qemu-utils
  command -v ansible-playbook >/dev/null || sudo apt-get install -y ansible
  ;;
esac
'''

[tasks.versions]
description = "Print the OS, Lima and Ansible versions"
run = '''
if command -v sw_vers >/dev/null; then
  os="macOS $(sw_vers --productVersion)"
else
  os="$(. /etc/os-release && echo "$PRETTY_NAME")"
fi
printf "%-14s%s\n" OS: "$os"
printf "%-14s%s\n" Lima: "$(limactl --version | cut -d' ' -f3)"
printf "%-14s%s\n" ansible-core: "$(ansible --version | sed -n '1s/.* //; 1s/]//p')"
'''

[tasks.up]
description = "Download the VM image and launch the VM"
run = '''
if limactl list -q | grep -qx dev; then
  limactl start --tty=false dev
else
  limactl start --tty=false --name=dev --set '.mounts=[{"location":"'"$PWD"'","mountPoint":"/workspace","writable":true}]' lima.yaml
fi
if [ "${PROVISION:-false}" = true ]; then mise run provision; fi
'''

[tasks.provision]
description = "Run the Ansible playbook on the guest"
run = "ansible-playbook playbook.yaml"

[tasks.verify]
description = "Check the web page with curl"
run = "curl --include --fail http://localhost:8080"

[tasks.ssh]
description = "Log into the guest"
run = "limactl shell --workdir /workspace dev || true"
raw = true

[tasks.status]
description = "Show the VM status"
run = "limactl list dev"

[tasks.halt]
description = "Shut down the guest"
run = "limactl stop dev"

[tasks.reload]
description = "Restart the VM, without provisioning unless PROVISION=true"
run = '''
if [ "$(limactl list dev 2>/dev/null | awk 'NR == 2 {print $2}')" = Running ]; then limactl stop dev; fi
mise run up
'''

[tasks.destroy]
description = "Delete the VM"
run = "limactl delete --force dev"

[tasks.purge]
description = "Delete Lima's downloaded images"
run = "limactl prune"
