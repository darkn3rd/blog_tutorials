# The Makefile builds the VM from file dependencies, so the VM tasks here run make.

[tasks.deps]
description = "Install vfkit and gvproxy (with Podman, on Apple Silicon), qemu-img and Ansible if they're missing"
run = [
  # Podman's formula is Apple Silicon only; on an Intel Mac the Makefile downloads vfkit and gvproxy.
  "[ \"$(uname -m)\" = x86_64 ] || { command -v vfkit && command -v gvproxy; } >/dev/null || test -x \"$(brew --prefix)/opt/podman/libexec/podman/vfkit\" || brew install podman",
  "command -v qemu-img >/dev/null || brew install qemu",
  "command -v ansible-playbook >/dev/null || brew install ansible",
]

[tasks.versions]
description = "Print the macOS, vfkit, gvproxy and Ansible versions"
run = '''
libexec="$(brew --prefix)/opt/podman/libexec/podman"
# The same order the Makefile uses: PATH, then Podman's copy, then bin/.
locate() { command -v "$1" || { test -x "$libexec/$1" && echo "$libexec/$1"; } || echo "bin/$1"; }
vfkit=$(locate vfkit)
gvproxy=$(locate gvproxy)
printf "%-14s%s\n" \
  macOS: $(sw_vers --productVersion) \
  vfkit: $("$vfkit" --version 2>/dev/null | awk '{print $NF}' | grep . || echo none) \
  gvproxy: $("$gvproxy" -version 2>/dev/null | awk '{print $NF}' | grep . || echo none) \
  ansible-core: $(ansible --version | sed -n '1s/.* //; 1s/]//p')
'''

[tasks.up]
description = "Download the image, create or start the VM and wait for it"
run = "make up"

[tasks.provision]
description = "Run the Ansible playbook on the guest"
run = "make provision"

[tasks.verify]
description = "Check the web page with curl"
run = "make verify"

[tasks.ssh]
description = "Log into the guest"
run = "make ssh || true"
raw = true

[tasks.status]
description = "Show the VM status"
run = "make status"

[tasks.halt]
description = "Shut down the guest"
run = "make halt"

[tasks.reload]
description = "Restart the VM, without provisioning unless PROVISION=true"
run = "make reload"

[tasks.destroy]
description = "Delete the VM, keeping the downloaded image"
run = "make destroy"

[tasks.purge]
description = "Delete the downloaded image"
run = "make purge"
