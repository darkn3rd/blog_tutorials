# mise has no Vagrant or VirtualBox tools, so deps installs them with Homebrew on
# macOS. On Linux, it points to HashiCorp's and Oracle's packages instead, since
# distributions often ship older versions.

[tasks.deps]
description = "Install Vagrant, VirtualBox and Ansible if they're missing"
run = '''
case "$(uname -s)" in
Darwin)
  command -v vagrant >/dev/null || brew install --cask vagrant
  command -v VBoxManage >/dev/null || brew install --cask virtualbox
  command -v ansible-playbook >/dev/null || brew install ansible
  ;;
Linux)
  command -v vagrant >/dev/null || {
    echo 'Install Vagrant from https://developer.hashicorp.com/vagrant/install' >&2
    exit 1; }
  command -v VBoxManage >/dev/null || {
    echo 'Install VirtualBox 7.1 or later from https://www.virtualbox.org/wiki/Linux_Downloads' >&2; exit 1; }
  command -v ansible-playbook >/dev/null || sudo apt-get install -y ansible
  ;;
esac
'''

[tasks.versions]
description = "Print the OS, Vagrant, VirtualBox and Ansible versions"
run = '''
if command -v sw_vers >/dev/null; then
  os="macOS $(sw_vers --productVersion)"
else
  os="$(. /etc/os-release && echo "$PRETTY_NAME")"
fi
printf "%-14s%s\n" OS: "$os"
printf "%-14s%s\n" Vagrant: "$(vagrant --version | cut -d' ' -f2)"
printf "%-14s%s\n" VirtualBox: "$(VBoxManage --version | cut -d'r' -f1)"
printf "%-14s%s\n" ansible-core: "$(ansible --version | sed -n '1s/.* //; 1s/]//p')"
'''

[tasks.up]
description = "Download the box and launch the VM"
run = '''
if [ "${PROVISION:-false}" = true ]; then flag=--provision; else flag=--no-provision; fi
vagrant up --provider=virtualbox "$flag"
'''

[tasks.provision]
description = "Run the Ansible playbook through Vagrant"
run = "vagrant provision"

[tasks.playbook]
description = "Run the Ansible playbook directly from the host"
run = [
  "vagrant ssh-config > .vagrant/ssh.config",
  "ansible-playbook playbook.yaml",
]

[tasks.verify]
description = "Check the web page with curl"
run = "curl --include --fail http://localhost:8080"

[tasks.ssh]
description = "Log into the guest"
run = "vagrant ssh -- -t 'cd /workspace && exec bash -l' || true"
raw = true

[tasks.status]
description = "Show the VM status"
run = "vagrant status"

[tasks.halt]
description = "Shut down the guest"
run = "vagrant halt"

[tasks.reload]
description = "Restart the VM, without provisioning unless PROVISION=true"
run = '''
if [ "${PROVISION:-false}" = true ]; then flag=--provision; else flag=--no-provision; fi
vagrant reload "$flag"
'''

[tasks.destroy]
description = "Delete the VM"
run = "vagrant destroy --force"

[tasks.purge]
description = "Delete the downloaded box"
run = '''
if vagrant box list | grep -q '^hako/ubuntu-26.04 *(virtualbox'; then
  vagrant box remove hako/ubuntu-26.04 --provider virtualbox --all --force
else
  echo "No cached box to remove."
fi
'''
