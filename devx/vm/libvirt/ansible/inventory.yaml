# The VM gets its address from libvirt's DHCP server, so the Makefile looks it
# up with `virsh domifaddr` and passes it as ansible_host.
web:
  hosts:
    dev:
      ansible_user: ubuntu
      ansible_ssh_private_key_file: .vm/id_ed25519
      ansible_ssh_common_args: >-
        -o IdentitiesOnly=yes
        -o StrictHostKeyChecking=no
        -o UserKnownHostsFile=/dev/null
