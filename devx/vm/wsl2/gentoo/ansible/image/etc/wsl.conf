# Added to the stage3 by `make image`. WSL reads this file each time the distro starts.

[boot]
# The stage3 is the systemd flavor, so nginx runs as a systemd service.
systemd=true

[network]
hostname=dev

[automount]
# Windows files appear owned by uid 1000 (the gentoo user) and not world-writable.
# Ansible ignores an ansible.cfg in a world-writable folder, which /mnt/c is by default.
options="metadata,uid=1000,gid=1000,umask=022"

[user]
# `make machine` creates this user.
default=gentoo
