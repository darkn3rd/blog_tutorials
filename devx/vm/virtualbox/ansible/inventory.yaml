# The Makefile overrides ansible_port when SSH_PORT is changed.
web:
  hosts:
    dev:
      ansible_host: 127.0.0.1
      ansible_port: 2222
      ansible_user: ubuntu
      ansible_ssh_private_key_file: .vm/id_ed25519
      ansible_ssh_common_args: "-o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
