# The Makefile builds the VM from file dependencies, so the VM tasks here run make.

[tasks.deps]
description = "Install krunkit, gvproxy (with Podman), qemu-img and Ansible if they're missing"
run = [
  "command -v krunkit >/dev/null || { brew tap slp/krun && brew install krunkit; }",
  "command -v gvproxy >/dev/null || test -x \"$(brew --prefix)/opt/podman/libexec/podman/gvproxy\" || brew install podman",
  "command -v qemu-img >/dev/null || brew install qemu",
  "command -v ansible-playbook >/dev/null || brew install ansible",
]

[tasks.versions]
description = "Print the macOS, krunkit, gvproxy and Ansible versions"
run = '''
gvproxy=$(command -v gvproxy || echo "$(brew --prefix)/opt/podman/libexec/podman/gvproxy")
printf "%-14s%s\n" \
  macOS: $(sw_vers --productVersion) \
  krunkit: $(krunkit --version | awk '{print $NF}') \
  gvproxy: $("$gvproxy" -version | awk '{print $NF}') \
  ansible-core: $(ansible --version | sed -n '1s/.* //; 1s/]//p')
'''

[tasks.up]
description = "Download the image, create or start the VM and wait for it"
run = "make up"

[tasks.provision]
description = "Run the Ansible playbook on the guest"
run = "make provision"

[tasks.verify]
description = "Check the web page with curl"
run = "make verify"

[tasks.ssh]
description = "Log into the guest"
run = "make ssh || true"
raw = true

[tasks.status]
description = "Show the VM status"
run = "make status"

[tasks.halt]
description = "Shut down the guest"
run = "make halt"

[tasks.reload]
description = "Restart the VM, without provisioning unless PROVISION=true"
run = "make reload"

[tasks.destroy]
description = "Delete the VM, keeping the downloaded image"
run = "make destroy"

[tasks.purge]
description = "Delete the downloaded image"
run = "make purge"
