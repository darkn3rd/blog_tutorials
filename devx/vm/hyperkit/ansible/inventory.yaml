# The Makefile overrides ansible_host with the VM's address, which macOS assigns
# when the VM starts.
web:
  hosts:
    dev:
      ansible_host: 192.168.64.2
      ansible_user: ubuntu
      ansible_ssh_private_key_file: .vm/id_ed25519
      ansible_ssh_common_args: >-
        -o IdentitiesOnly=yes
        -o StrictHostKeyChecking=no
        -o UserKnownHostsFile=/dev/null
